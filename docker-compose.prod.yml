services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pramaan-backend
    restart: unless-stopped
    environment:
      - PROJECT_NAME=PRAMAAN Digital Academic Records Platform
      - ENVIRONMENT=production
      - SECRET_KEY=${SECRET_KEY:-pramaan_demo_super_secret_jwt_key_2024_secure_signing_token}
      - DATABASE_URL=sqlite:////app/data/pramaan.db
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
    volumes:
      - pramaan_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/public-stats"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pramaan-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pramaan-frontend
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://backend:8000
      - PORT=3000
      - HOSTNAME=0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pramaan-network

  nginx:
    image: nginx:alpine
    container_name: pramaan-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - pramaan-network

volumes:
  pramaan_data:
    driver: local

networks:
  pramaan-network:
    driver: bridge
